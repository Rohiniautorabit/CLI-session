<template>
    <lightning-card title="Filtering LWC">
        <div class="slds-p-around_medium">
            <lightning-layout>
                <lightning-layout-item size="2" padding="around-small">
                   <lightning-combobox name="filterBy" value={filterby} label="Filter By"
                   options={filteroption} onchange={filterbyhandler}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                    <lightning-input type="text" label="Filter" onkeyup={filterhandler}></lightning-input>
                </lightning-layout-item>

                <lightning-layout-item size="2" alignment-bump="left" padding="around-small">
                    <lightning-combobox name="sortby" value={sortby} label="Sort By"
                    options={sortoption} onchange={sorthandler}></lightning-combobox>
                 </lightning-layout-item>
            </lightning-layout>
        <table>
           <thead>
            <tr>
                <template for:each={heading}  for:item="headingitem">
                    <th key={headingitem}>
                        {headingitem}
                    </th>
                </template>
            </tr>
           </thead>
            <tbody>
                  <template for:each={filteredtable} for:item="filteredtabledata">
                    <tr key={filteredtabledata.Id}>
                            <td>{filteredtabledata.Id}</td>    
                            <td>{filteredtabledata.Name}</td>       
                            <td>{filteredtabledata.Title}</td>       
                            <td>{filteredtabledata.Email}</td>                                  
                    </tr>   
                    </template>
            </tbody>
        </table>
        </div>
    </lightning-card>    
</template>
