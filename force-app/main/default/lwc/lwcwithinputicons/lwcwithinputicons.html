<template>
    <lightning-card title="LWC with input icons">
        <div class="slds-p-around_medium">
            <div class="slds-is-relative">
                <lightning-icon size="x-small" icon-name="utility:email" alternative-text="email" title="email" 
                class="input-icon icon-left"></lightning-icon>
            
                <lightning-input  type="text" label="Email" class="icon-left"></lightning-input>
            </div>
       
            <div class="slds-is-relative">
                <lightning-icon size="x-small" icon-name={passwordIcon} alternative-text="password" title="password" 
                class="input-icon icon-left" onclick={passwordHandler}></lightning-icon>
                <lightning-input  type={passwordType} label="Password" class="icon-left"></lightning-input>
            </div>
        </div>

    </lightning-card>
</template>
